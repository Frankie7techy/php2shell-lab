# php-lab.ini — stock php.ini-production values, no hardening tweaks.
# The whole point: the advisories confirmed RCE with DEFAULT settings.
# Do not add mitigations here; that defeats the purpose of the lab.

memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
max_input_nesting_depth = 64
session.upload_progress.enabled = 1
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = "1"

; 8.5 defaults: backtraces on fatal errors are enabled by default and are the
; confirmed CVE-2026-109619 producer. Keep it on.
fatal_error_backtraces = 1

display_errors = On
log_errors = On
error_log = /var/log/php2shell-lab-php.log
