# php2shell-lab Apache vhost — mod_php on port 8080, prefork-tuned.
#
# Small worker pool on purpose: CVE-2026-109618/109619 exploitation requires the
# producer and consumer requests to land on the same worker process. Real
# internet-facing prefork servers with few workers are the confirmed-exploitable
# configuration per GHSA-w8hw-w9fx-j79w ("normal prefork configurations with
# multiple workers").

Listen 8080

# mod_php requires prefork; Ubuntu defaults to mpm_event.
# (handled by setup-wsl.sh: a2dismod mpm_event && a2enmod mpm_prefork)

<VirtualHost *:8080>
    ServerName php2shell-lab.local
    DocumentRoot /var/www/php2shell-lab

    <Directory /var/www/php2shell-lab>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Serve .php via the source-built PHP module
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    DirectoryIndex index.php

    ErrorLog  ${APACHE_LOG_DIR}/php2shell-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/php2shell-lab-access.log combined

    # NOTE: MaxConnectionsPerChild is server-level only (kept at its default 0 in
    # mpm_prefork.conf), so workers are recycled only on crash — exactly what the
    # harness wants to observe.
</VirtualHost>
